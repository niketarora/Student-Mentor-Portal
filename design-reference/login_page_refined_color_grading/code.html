<!-- Login Form Content -->
<div class="max-w-md w-full mx-auto lg:mx-0 py-xl">
<div class="mb-lg text-center lg:text-left">
<p class="font-label-md text-label-md text-secondary uppercase tracking-widest mb-xs">Welcome to SSMP Portal</p>
<h2 class="font-headline-lg text-headline-lg text-primary mb-xs">Sign In</h2>

<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Login ID with @muj.manipal.edu suffix -->
<div class="flex flex-col space-y-xs">
<div class="relative flex items-center">
<input class="w-full px-sm py-sm rounded-xl border border-outline-variant bg-surface-container-low font-body-md text-body-md form-input-focus transition-all" id="login_id" placeholder="Registration Number" type="text"/>

</div>
<!-- Password -->

<div class="relative">
<input class="w-full px-sm py-sm rounded-xl border border-outline-variant bg-surface-container-low font-body-md text-body-md form-input-focus transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Dual Login Actions -->
<div class="pt-sm space-y-md">
<div class="flex flex-col sm:flex-row gap-sm">
<button class="flex-1 bg-primary text-white font-label-md py-3 rounded-full hover:opacity-90 active:scale-[0.98] transition-all shadow-md flex items-center justify-center space-x-xs" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>

<!-- Micro-interaction Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Password Toggle logic
        const togglePassBtn = document.querySelector('button .material-symbols-outlined')?.parentElement;
        const togglePassIcon = document.querySelector('button .material-symbols-outlined');
        
        if (togglePassBtn && togglePassIcon) {
            togglePassBtn.addEventListener('click', () => {
                const passInput = document.getElementById('password');
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    togglePassIcon.textContent = 'visibility_off';
                } else {
                    passInput.type = 'password';
                    togglePassIcon.textContent = 'visibility';
                }
            });
        }
    });
</script>
